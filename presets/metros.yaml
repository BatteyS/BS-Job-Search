# US metros to choose from, and what every scan knows about place names.
#
# `metros` is a menu. /setup copies the ones a user picks, whole, into
# profile/filters.yaml (or copy them yourself), where each becomes theirs to edit:
# add a suburb, drop one, set its penalty.
# A scan reads only the names from here, so that a city inside a longer name
# is not taken for itself: "Mesa" in "Costa Mesa" is not Phoenix, even for a
# profile without Los Angeles.
#
# The two lists at the end are read by every scan, on top of whatever
# filters.yaml adds:
#
#   ambiguous_cities  names that count only beside a state that fits: "Dublin"
#                     alone could be Ireland, Ohio, or the Bay Area suburb.
#   non_us_markers    words that put a place outside the US.
#
# Each metro has:
#   search_as   where the aggregators (Adzuna, USAJOBS, Indeed and the other
#               scraped boards) search, "City, ST", within 40 miles. A metro
#               wider than that lists two.
#   states      a posting that names a state must name one of these.
#   cities      place names a posting's location may use, lowercase.
#   regions     names for the area itself ("bay area", "dfw").
#
# Rules tests/test_locations.py holds this file to: a name listed under two
# metros is also in ambiguous_cities; every `search_as` place lands inside its
# own metro; and "City, ST" for every city resolves to its own metro.
#
# Seven metros (bay_area through boston) are the ones this workflow has run on
# since 2026-08. The rest were added 2026-10-29 for new users and have not yet
# met a real scan, so check a new metro's first digest for strays.

