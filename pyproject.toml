# Lets uv (astral.sh/uv) set up Python for this workflow, so nobody installs
# Python or manages a virtualenv by hand. The first `uv run` makes .venv and
# installs everything below; a later one installs what a newer uv.lock adds:
#
#     uv run ui/server.py                  # the page
#     uv run python scripts/doctor.py
#
# `uv run` keeps whatever is installed. A plain `uv sync` uninstalls any extra it
# is not given, so name the one extra there: `uv sync --extra scraped`.
#
# uv fetches the Python in .python-version if the machine lacks it. That is 3.12,
# which every locked package has wheels for. uv.lock pins every package, so each
# copy installs the same versions. This is not a package -- the scripts run from
# scripts/ -- so nothing gets built or installed beyond the dependencies.

[project]
name = "bs-job-search"
version = "0.1.0"
description = "Job scan, tailored resumes, and cover letters, run from Claude Code"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6",
    "requests>=2.28",
    # Reading a PDF resume with scripts/extract_text.py.
    "pypdf>=4",
    # The local page (ui/), whose skill buttons drive the user's own Claude Code
    # through the Agent SDK. Dependencies rather than an extra: setup runs from
    # the page and may install the `scraped` extra while it runs, and a sync
    # that left the page's packages out would uninstall the page under it.
    "claude-agent-sdk>=0.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# The scraped job boards (Indeed, LinkedIn, Glassdoor, ZipRecruiter) -- opt-in,
# like the boards themselves. Pinned: older releases have a different
# scrape_jobs(), and 1.1 returned nothing from Glassdoor or ZipRecruiter.
scraped = ["python-jobspy==1.4.1"]
# Empty: their packages are dependencies now. Kept so a `uv sync --extra pdf
# --extra ui` from older instructions still runs.
pdf = []
ui = []

# For running the tests: `uv run --group test pytest`. A group rather than an
# extra, so nobody's install pulls in pytest by accident.
[dependency-groups]
test = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
